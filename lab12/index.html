<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Age Verification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: #080820; overflow: hidden;
        }
        /* Animated stars */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .star {
            position: absolute; width: 2px; height: 2px; background: #fff;
            border-radius: 50%; animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50%      { opacity: 1; transform: scale(1.5); }
        }
        /* Shooting stars */
        .shooting-star {
            position: fixed; width: 100px; height: 2px;
            background: linear-gradient(90deg, #4facfe, transparent);
            border-radius: 50%; z-index: 0;
            animation: shoot 3s linear infinite;
            opacity: 0;
        }
        .shooting-star:nth-child(2) { animation-delay: 1.5s; top: 30%; }
        .shooting-star:nth-child(3) { animation-delay: 2.8s; top: 60%; }
        @keyframes shoot {
            0%  { left: -100px; opacity: 0; transform: rotate(-30deg); }
            10% { opacity: 1; }
            70% { opacity: 1; }
            100%{ left: 110%; opacity: 0; transform: rotate(-30deg); }
        }
        .card {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.04); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px; padding: 55px 45px; text-align: center;
            max-width: 460px; width: 92%;
            animation: floatIn 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes floatIn { from { opacity: 0; transform: translateY(80px) scale(0.85); } }
        .shield {
            font-size: 4rem; margin-bottom: 10px;
            animation: shieldPulse 2s ease-in-out infinite;
        }
        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(79,172,254,0.3)); }
            50%      { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(79,172,254,0.6)); }
        }
        .card h1 {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 1.8rem; margin-bottom: 5px;
        }
        .card .sub { color: rgba(255,255,255,0.4); font-size: 0.85rem; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 18px; }
        .input-group input {
            width: 100%; padding: 16px 20px 16px 50px;
            background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.08);
            border-radius: 14px; font-size: 1rem; color: #fff; outline: none;
            font-family: 'Poppins', sans-serif; transition: all 0.4s;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.25); }
        .input-group input:focus { border-color: #4facfe; background: rgba(79,172,254,0.08); box-shadow: 0 0 20px rgba(79,172,254,0.15); }
        .input-group .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; }
        /* Remove spinner for number input */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .card button {
            width: 100%; padding: 16px; margin-top: 8px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #0a0a2e; border: none; border-radius: 14px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            font-family: 'Poppins', sans-serif; letter-spacing: 1px;
            transition: all 0.4s; position: relative; overflow: hidden;
        }
        .card button::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        .card button:hover::before { left: 100%; }
        .card button:hover { transform: translateY(-3px); box-shadow: 0 10px 35px rgba(79,172,254,0.4); }
        .card button:active { transform: translateY(0) scale(0.97); }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="card">
        <div class="shield">🛡️</div>
        <h1>Age Verification</h1>
        <p class="sub">Please verify your identity to continue</p>
        <form method="POST" action="check.php">
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" name="name" placeholder="Enter your name" required autocomplete="off">
            </div>
            <div class="input-group">
                <span class="icon">🎂</span>
                <input type="number" name="age" placeholder="Enter your age" required min="1" max="150">
            </div>
            <button type="submit">🔍 Verify</button>
        </form>
    </div>
    <script>
        const stars = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${Math.random()*3+1.5}s;animation-delay:${Math.random()*3}s;`;
            stars.appendChild(s);
        }
    </script>
</body>
</html>
